name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rabbitcontrol-android
        uses: actions/checkout@v4

      - name: Checkout rabbitcontrol-core
        uses: actions/checkout@v4
        with:
          repository: TokenBoom/rabbitcontrol-core
          ref: main
          fetch-depth: 0
          path: rabbitcontrol-core

      - name: Resolve bundled core version metadata
        id: core_meta
        run: |
          cd rabbitcontrol-core
          RAW_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '0.1.0')"
          VER="${RAW_TAG#v}"
          VER="${VER#V}"
          SHA="$(git rev-parse --short HEAD)"
          echo "core_version=$VER" >> "$GITHUB_OUTPUT"
          echo "core_git_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install Android SDK & NDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RC_CORE_VERSION: ${{ steps.core_meta.outputs.core_version }}
          RC_CORE_GIT_SHA: ${{ steps.core_meta.outputs.core_git_sha }}
          CORE_SIGNING_PUBLIC_KEY_B64: ${{ secrets.CORE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease -PversionName="$TAG_VERSION"

      - name: Clean up temporary Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Prepare Release artifacts
        run: |
          mkdir -p release-assets
          APK_NAME="RabbitControl-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"
          (cd release-assets && sha256sum "${APK_NAME}" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
