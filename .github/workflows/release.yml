name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rabbitcontrol-android
        uses: actions/checkout@v4

      - name: Checkout rabbitcontrol-core
        uses: actions/checkout@v4
        with:
          repository: TokenBoom/rabbitcontrol-core
          ref: main
          path: rabbitcontrol-core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK & NDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease -PversionName="$TAG_VERSION"

      - name: Clean up temporary Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Prepare Release artifacts
        run: |
          mkdir -p release-assets
          APK_NAME="RabbitControl-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"
          (cd release-assets && sha256sum "${APK_NAME}" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
